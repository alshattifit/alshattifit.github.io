<style>
/* Layout: one narrow centered column — brand mark, then a stack of full-width link buttons */
:root{
  --bg:#F2F5F4; --card:#FFFFFF; --ink:#0F2430; --muted:#56666E; --line:#E1E7E6;
  --accent:#E8582A; --accent-soft:#FDE8DF; --mark:#0F2430; --mark-ink:#FFFFFF;
  --display:'Readex Pro','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1A22; --card:#13262F; --ink:#EAF0F1; --muted:#9DB0B6; --line:#22404C;
  --accent:#F06A3E; --accent-soft:#3A2018; --mark:#18323D; --mark-ink:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1A22; --card:#13262F; --ink:#EAF0F1; --muted:#9DB0B6; --line:#22404C;
  --accent:#F06A3E; --accent-soft:#3A2018; --mark:#18323D; --mark-ink:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:460px;margin:0 auto;padding-block:56px 40px;display:flex;flex-direction:column;gap:32px}
.brand{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.mark{width:88px;height:88px;border-radius:26px;background:var(--mark);color:var(--mark-ink);display:flex;align-items:center;justify-content:center}
.logo{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.1;direction:ltr;margin:0}
.logo span{color:var(--accent)}
.tag{color:var(--muted);margin:0}
.links{display:flex;flex-direction:column;gap:12px}
.link{display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 16px;border-radius:18px;
  background:var(--card);color:var(--ink);text-decoration:none;border:1px solid var(--line)}
.link:hover{border-color:var(--accent)}
.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:42px;height:42px;flex-shrink:0;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.txt{flex-grow:1;display:flex;flex-direction:column;min-width:0}
.txt b{font-size:16px;font-weight:600}
.txt small{font-size:13px;color:var(--muted)}
.arrow{color:var(--muted);flex-shrink:0}
.link.wa{background:var(--accent);border-color:transparent;color:#fff}
.link.wa .ico{background:rgba(255,255,255,.18);color:#fff}
.link.wa small,.link.wa .arrow{color:rgba(255,255,255,.85)}
footer{text-align:center;color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:no-preference){.link{transition:border-color .15s,transform .15s}.link:active{transform:scale(.99)}}
</style>
